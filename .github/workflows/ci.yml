name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Type-check · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit all dependencies
        run: yarn audit --level moderate

      - name: Lint
        run: yarn lint

      - name: Check button design rules
        run: yarn check:buttons

      - name: Check Agent generated contract snapshot
        run: yarn api:agent:check

      - name: Check News generated contract snapshot
        run: yarn api:news:check

      - name: Type-check
        run: yarn typecheck

      - name: E2E type-check
        run: yarn typecheck:e2e

      - name: Script type-check
        run: yarn typecheck:scripts

      - name: Unit test coverage
        run: yarn test:coverage

      - name: Check changed-line coverage
        run: yarn test:coverage:changed

      - name: Build
        run: yarn build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Mock E2E smoke
        run: yarn e2e:smoke
