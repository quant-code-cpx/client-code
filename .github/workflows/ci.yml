name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Type-check · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level moderate

      - name: Lint
        run: yarn lint

      - name: Check Agent API contract drift
        env:
          AGENT_OPENAPI_PATH: openapi/agent-openapi.json
        run: yarn api:agent:check

      - name: Type-check
        run: yarn typecheck

      - name: E2E type-check
        run: yarn typecheck:e2e

      - name: Unit test coverage
        run: yarn test:coverage

      - name: Build
        run: yarn build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Mock E2E smoke
        run: yarn e2e:smoke
