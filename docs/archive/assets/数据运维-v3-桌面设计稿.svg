        <text class="small tabular" x="1032" y="156">0</text>
        <rect x="1162" y="138" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#0C66E4"/><text class="button primary" x="1221" y="158" text-anchor="middle">立即同步</text>

