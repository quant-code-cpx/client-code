        <text class="metric" x="350" y="62">42</text>
        <text class="small" x="408" y="58">成功 <tspan class="success">38</tspan>　失败 <tspan class="error">1</tspan>　跳过 <tspan class="warning">3</tspan></text>

        <line x1="652" y1="16" x2="652" y2="68" stroke="#DFE1E6"/>
        <text class="small" x="676" y="26">最近同步</text>
        <text class="metric" x="676" y="62">4 分钟前</text>
        <text class="small" x="794" y="58">daily · 成功</text>

