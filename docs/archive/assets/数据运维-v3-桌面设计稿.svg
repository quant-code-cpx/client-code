        <text class="body-strong" x="650" y="48">全量同步确认</text>
        <text class="small" x="650" y="69">将提交 42 个已选任务；其中 1 个不支持全量，将由后端跳过。</text>
        <rect x="650" y="83" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#B76E00"/>
        <text class="small" x="664" y="99">请输入“全量”</text><text class="body-strong" x="664" y="119">全量</text>
