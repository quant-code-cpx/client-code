        <rect x="0" y="40" width="1304" height="28" fill="#F7F9FC"/>
        <text class="small-strong" x="18" y="59">类别</text><text class="small-strong" x="274" y="59">任务数</text><text class="small-strong" x="430" y="59">成功</text><text class="small-strong" x="564" y="59">失败</text><text class="small-strong" x="698" y="59">跳过</text><text class="small-strong" x="844" y="59">最近同步</text><text class="small-strong" x="1174" y="59">连续失败</text>
        <text class="small" x="18" y="89">行情数据</text><text class="small tabular" x="274" y="89">12</text><text class="small success tabular" x="430" y="89">11</text><text class="small error tabular" x="564" y="89">0</text><text class="small warning tabular" x="698" y="89">1</text><text class="small tabular" x="844" y="89">2026-08-08 18:05:26</text><text class="small tabular" x="1196" y="89">0</text>
      </g>
