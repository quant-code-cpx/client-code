        <rect x="14" y="191" width="16" height="16" rx="3" fill="#0C66E4"/>
        <path d="M18 199l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
