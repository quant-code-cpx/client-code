        <path d="M18 291l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="body-strong" x="48" y="288">财务指标</text><text class="mono" x="48" y="305">fina_indicator</text>
