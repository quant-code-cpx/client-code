        <line x1="18" y1="42" x2="636" y2="42" stroke="#EBECF0"/>

        <text class="mono" x="18" y="62">18:05:26</text><circle cx="104" cy="58" r="4" fill="#22A06B"/>
        <text class="small-strong" x="116" y="62">daily</text><text class="small" x="234" y="62">日线行情同步完成</text><text class="small-strong success" x="624" y="62" text-anchor="end">成功</text>
        <text class="mono" x="18" y="84">17:26:12</text><circle cx="104" cy="80" r="4" fill="#D32F2F"/>
        <text class="small-strong" x="116" y="84">fina_indicator</text><text class="small" x="234" y="84">接口返回限流</text><text class="small-strong error" x="624" y="84" text-anchor="end">失败</text>
        <text class="mono" x="18" y="106">16:40:03</text><circle cx="104" cy="102" r="4" fill="#FFAB00"/>
        <text class="small-strong" x="116" y="106">moneyflow</text><text class="small" x="234" y="106">非交易日任务跳过</text><text class="small-strong warning" x="624" y="106" text-anchor="end">跳过</text>
      </g>

      <!-- 分类汇总表：字段不删 -->
      <g transform="translate(20 292)">
        <rect width="1304" height="106" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
