    <g>
      <text class="page-title" x="0" y="28">数据运维</text>
      <text class="small" x="0" y="52">Tushare 数据同步与质量治理</text>

      <rect x="744" y="8" width="108" height="32" rx="16" fill="#EAF2FF"/>
      <circle cx="762" cy="24" r="4" fill="#0C66E4"/>
      <text class="small-strong primary" x="774" y="28">超级管理员</text>

      <rect x="864" y="8" width="94" height="32" rx="16" fill="#E9F7EF"/>
      <circle cx="882" cy="24" r="4" fill="#22A06B"/>
      <text class="small-strong success" x="894" y="28">实时在线</text>

      <rect x="970" y="4" width="112" height="40" rx="8" fill="#F7F8F9" stroke="#DFE1E6"/>
      <text class="button muted" x="1026" y="29" text-anchor="middle">告警订阅</text>
      <circle cx="1070" cy="13" r="5" fill="#F2F3F5" stroke="#C1C7D0"/>
      <text class="small muted" x="1070" y="16" text-anchor="middle">×</text>

      <rect x="1094" y="4" width="94" height="40" rx="8" fill="#FFFFFF" stroke="#C1C7D0"/>
      <text class="button" x="1141" y="29" text-anchor="middle" fill="#344563">审计</text>

      <rect x="1200" y="4" width="96" height="40" rx="8" fill="#FFFFFF" stroke="#0C66E4"/>
      <path d="M1221 18a7 7 0 1 1-1 8" fill="none" stroke="#0C66E4" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M1218 18h5v5" fill="none" stroke="#0C66E4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="button primary" x="1261" y="29" text-anchor="middle">刷新</text>
    </g>

