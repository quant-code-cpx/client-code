<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title desc">
  <title id="title">数据运维 v3 桌面端设计稿</title>
  <desc id="desc">严格保持现有功能的数据运维控制台默认任务调度状态，包含页头、状态总览、四个主标签、全局同步模式、任务选择、四类同步入口及全量确认状态。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="14" flood-color="#637381" flood-opacity="0.12"/>
    </filter>
    <style>
      .page-title{font:700 28px "DM Sans","PingFang SC",sans-serif;fill:#172B4D}
      .section-title{font:700 16px "DM Sans","PingFang SC",sans-serif;fill:#172B4D}
      .body{font:400 14px "DM Sans","PingFang SC",sans-serif;fill:#172B4D}
      .body-strong{font:600 14px "DM Sans","PingFang SC",sans-serif;fill:#172B4D}
      .small{font:400 12px "DM Sans","PingFang SC",sans-serif;fill:#637381}
      .small-strong{font:600 12px "DM Sans","PingFang SC",sans-serif;fill:#344563}
      .button{font:600 13px "DM Sans","PingFang SC",sans-serif}
      .metric{font:700 24px "DM Sans","PingFang SC",sans-serif;fill:#172B4D;font-variant-numeric:tabular-nums}
      .mono{font:500 11px "SFMono-Regular",Consolas,monospace;fill:#637381}
      .tabular{font-variant-numeric:tabular-nums}
      .primary{fill:#0C66E4}.success{fill:#14804A}.warning{fill:#8A5A00}.error{fill:#B42318}.muted{fill:#97A0AF}
    </style>
  </defs>

  <rect width="1440" height="1320" fill="#F4F6F8"/>
  <g transform="translate(48 28)">
