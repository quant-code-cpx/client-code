      <!-- 实现门禁与全量确认补充状态 -->
      <g transform="translate(20 458)">
        <rect width="608" height="156" rx="12" fill="#F7F9FC" stroke="#DFE1E6"/>
        <text class="body-strong" x="18" y="28">状态与权限门禁</text>
        <circle cx="24" cy="54" r="4" fill="#0C66E4"/><text class="small" x="38" y="58">ADMIN：可查看、筛选、勾选；全部写动作禁用</text>
        <circle cx="24" cy="79" r="4" fill="#22A06B"/><text class="small" x="38" y="83">SUPER_ADMIN：四类同步入口可用</text>
        <circle cx="24" cy="104" r="4" fill="#FFAB00"/><text class="small" x="38" y="108">全局 isSyncing=true：所有同步入口一起禁用</text>
        <circle cx="24" cy="129" r="4" fill="#97A0AF"/><text class="small" x="38" y="133">告警订阅、清缓存、单/批重试与删除：所有角色仍禁用</text>

        <rect x="632" width="672" height="156" rx="12" fill="#FFF9F0" stroke="#F5CD7A" stroke-dasharray="5 4"/>
