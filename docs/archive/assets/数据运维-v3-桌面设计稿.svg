        <rect x="740" y="229" width="58" height="24" rx="12" fill="#E9F7EF"/><text class="small-strong success" x="769" y="245" text-anchor="middle">成功</text>
        <text class="small tabular" x="844" y="244">08-08 17:21</text>
        <text class="small tabular" x="1032" y="244">0</text>
        <rect x="1162" y="226" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#0C66E4"/><text class="button primary" x="1221" y="246" text-anchor="middle">立即同步</text>
        <line x1="0" y1="268" x2="1304" y2="268" stroke="#EBECF0"/>

