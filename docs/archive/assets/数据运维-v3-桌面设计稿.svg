        <path d="M18 61l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="small-strong" x="48" y="66">行情数据</text><text class="small" x="118" y="66">12 个任务</text>

        <!-- daily -->
        <rect x="14" y="95" width="16" height="16" rx="3" fill="#0C66E4"/>
        <path d="M18 103l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="body-strong" x="48" y="100">日线行情</text><text class="mono" x="48" y="117">daily</text>
        <text class="small" x="270" y="106">行情数据</text>
        <text class="small" x="370" y="106">交易日收盘后</text>
        <text class="small success" x="600" y="106" text-anchor="middle">是</text>
        <text class="small success" x="684" y="106" text-anchor="middle">是</text>
        <rect x="740" y="91" width="58" height="24" rx="12" fill="#E9F7EF"/><text class="small-strong success" x="769" y="107" text-anchor="middle">成功</text>
        <text class="small tabular" x="844" y="106">08-08 18:05</text>
        <text class="small tabular" x="1032" y="106">0</text>
        <rect x="1162" y="88" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#0C66E4"/><text class="button primary" x="1221" y="108" text-anchor="middle">立即同步</text>
        <line x1="0" y1="130" x2="1304" y2="130" stroke="#EBECF0"/>

        <!-- daily_basic -->
        <rect x="14" y="145" width="16" height="16" rx="3" fill="#0C66E4"/>
        <path d="M18 153l3 3 6-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="body-strong" x="48" y="150">每日指标</text><text class="mono" x="48" y="167">daily_basic</text>
        <text class="small" x="270" y="156">行情数据</text>
        <text class="small" x="370" y="156">交易日收盘后</text>
        <text class="small success" x="600" y="156" text-anchor="middle">是</text>
        <text class="small success" x="684" y="156" text-anchor="middle">是</text>
        <rect x="740" y="141" width="58" height="24" rx="12" fill="#FFF7E6"/><text class="small-strong warning" x="769" y="157" text-anchor="middle">跳过</text>
